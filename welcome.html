<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Label Filter for YouTube</title>
  <link rel="stylesheet" href="ui.css" />
  <style>
    body { width: auto; max-width: 560px; margin: 0 auto; padding: 32px 16px; font-size: 14px; }
    header h1 { font-size: 18px; }
    p + p { margin-top: 8px; }
    .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
    button { padding: 6px 14px; }
    #list-status { margin-top: 10px; }
    .demo { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    #demo-reason { margin-top: 6px; }
    button:disabled, button:disabled:hover { background: #2a2a2a; opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <!-- All visible text comes from TEXT in welcome.js (data-t keys). -->
  <header>
    <img src="icons/icon48.png" width="28" height="28" alt="" />
    <h1 data-t="title"></h1>
  </header>

  <section>
    <p data-t="intro"></p>
    <p data-t="expect"></p>
  </section>

  <section>
    <h2 data-t="listHeading"></h2>
    <p data-t="listBody"></p>
    <p class="muted"><span data-t="creditBefore"></span><a href="https://github.com/Override92/AiSList" target="_blank" rel="noopener" data-t="creditLink"></a><span data-t="creditAfter"></span></p>
    <p class="muted" data-t="listPrivacy"></p>
    <div class="actions" id="list-actions">
      <button type="button" id="list-later" data-t="listLater"></button>
      <button type="button" class="primary" id="list-on" data-t="listOn"></button>
    </div>
    <p id="list-status" role="status" hidden></p>
  </section>

  <section>
    <h2 data-t="demoHeading"></h2>
    <p data-t="demoBody"></p>
    <div class="demo" id="demo"></div>
    <p class="muted" id="demo-reason" role="status"></p>
    <p class="muted" data-t="demoHistory"></p>
  </section>

  <section>
    <div class="row">
      <span id="lookups-label" data-t="lookupsLabel"></span>
      <label class="toggle">
        <input type="checkbox" id="lookups" aria-labelledby="lookups-label" />
        <span class="slider"></span>
      </label>
    </div>
    <p class="muted" style="margin-top:6px" data-t="lookupsCost"></p>
  </section>

  <p class="muted" data-t="later"></p>

  <script src="listswitch.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
